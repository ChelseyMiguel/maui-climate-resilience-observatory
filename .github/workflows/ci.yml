name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check lib app tests scripts
      # Tests that need the gitignored GLOBE cache skip themselves (see tests/conftest.py).
      - run: python -m pytest tests/unit -q -rs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The site is served from the committed build, so a source change without a
      # rebuilt app/static/site/ would ship stale JavaScript.
      - name: Committed build matches the source
        run: git diff --exit-code --stat -- app/static/site
